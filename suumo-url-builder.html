
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUUMO条件URLビルダー</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e2e5ea; --text:#1b1f24; --muted:#6b7280;
  --accent:#00a040; --accent-d:#008434; --chip:#eef7f0; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171b;--panel:#1c2026;--line:#2c323a;--text:#e8eaed;--muted:#9aa3ad;--chip:#17301f;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:14px;line-height:1.6;padding-bottom:150px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
main{max-width:940px;margin:0 auto;padding:18px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.card>h2{margin:0;font-size:13px;font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card>h2 .arw{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
.card.closed>h2 .arw{transform:rotate(-90deg)}
.card.closed .body{display:none}
.body{padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:130px;flex:1}
.fld label{font-size:11px;color:var(--muted);font-weight:600}
select,input[type=text]{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--text);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:5px 10px}
.chk{display:flex;align-items:flex-start;gap:6px;padding:3px 5px;border-radius:6px;cursor:pointer;font-size:13px}
.chk:hover{background:var(--chip)}
.chk input{margin:4px 0 0;accent-color:var(--accent);flex:none}
.sub{font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 3px;letter-spacing:.04em}
.sub:first-child{margin-top:0}
.mini{font-size:11px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);padding:6px 11px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:var(--accent-d)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 14px;z-index:30}
.fwrap{max-width:940px;margin:0 auto;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
#url{flex:1;min-width:240px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;height:56px;overflow:auto;
  word-break:break-all;color:var(--muted)}
.fbtn{display:flex;gap:6px;flex-wrap:wrap}
#summary{max-width:940px;margin:0 auto 6px;font-size:11px;color:var(--muted)}
.preset{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);
  border-radius:20px;padding:3px 5px 3px 11px;font-size:12px}
.tag button{border:0;background:transparent;padding:0 4px;color:var(--muted);font-size:14px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;background:#1b1f24;color:#fff;
  padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.95}
.badge{display:inline-block;background:var(--chip);border:1px solid var(--accent);color:var(--accent);
  border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700;vertical-align:2px;margin-left:6px}
.modebar{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-end}
.modebtn{display:flex;align-items:center;cursor:pointer;font-size:13px;font-weight:600}
.modebtn input{position:absolute;opacity:0;pointer-events:none}
.modebtn span{padding:7px 14px;color:var(--muted);border-right:1px solid var(--line)}
.modebtn:last-child span{border-right:0}
.modebtn input:checked+span{background:var(--accent);color:#fff}
.lrow{border-bottom:1px solid var(--line);padding:2px 0}
.lrow:last-child{border-bottom:0}
.lhead{display:flex;align-items:center;gap:8px}
.lhead .chk{flex:1}
.lnk{border:0;background:transparent;color:var(--accent);font-size:12px;padding:2px 6px}
.lnk:hover{text-decoration:underline}
.lst{padding:4px 0 8px 24px}
.stcard{display:flex;flex-direction:column;gap:1px;padding:5px 7px;border:1px solid var(--line);
  border-radius:7px;cursor:pointer;background:var(--panel);text-align:left;font:inherit}
.stcard:hover{background:var(--chip);border-color:var(--accent)}
.stcard b{font-weight:700;font-size:13px}
.stcard i{font-style:normal;font-size:11px;color:var(--muted)}
.tag.line{background:var(--panel)}

/* 路線の地図 */
.mapdlg{position:fixed;inset:0;z-index:100;background:rgba(10,14,20,.55);display:flex;
  align-items:center;justify-content:center;padding:14px}
.mapbtn{white-space:nowrap}
.stname{background:rgba(255,255,255,.93);border:1px solid #cfd6de;border-radius:4px;padding:0 4px;
  font-size:11px;font-weight:600;color:#1b1f24;white-space:nowrap;cursor:pointer;
  transform:translate(9px,-50%);display:inline-block;line-height:17px}
.stname.on{background:#00a040;border-color:#00a040;color:#fff}
.stname:hover{border-color:#00a040}
.mapdlg[hidden]{display:none!important}
.mapbox{background:var(--panel);border-radius:12px;width:min(1500px,100%);height:100%;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.maphead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.maphead b{font-size:15px;white-space:nowrap}
.maphead .mini{line-height:1.35}
.maphead .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;padding:2px 8px;color:var(--muted)}
#lineMap{flex:1;min-height:0}
.mapfoot{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mapfoot .mini{flex:1}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:10px}
@media (max-width:600px){ .mapdlg{padding:0} .mapbox{border-radius:0;height:100%} .maphead .mini{font-size:10px} }

<body>
<header>
  <h1>SUUMO 条件URLビルダー <span class="badge">東京都</span></h1>
  <p>いつもの条件を選ぶだけ。区市町村でも沿線・駅でも、SUUMO賃貸の検索URLを作ってそのまま開けます。</p>
</header>
<main>

<div class="card" id="c-preset">
  <h2>保存した条件<span class="arw">▼</span></h2>
  <div class="body">
    <div class="tools">
      <input type="text" id="presetName" placeholder="条件名（例: 都心1LDK 2階以上）" style="max-width:280px">
      <button onclick="savePreset()">この条件を保存</button>
      <button onclick="saveDefault()">起動時の初期条件にする</button>
      <button onclick="resetAll()">条件をクリア</button>
    </div>
    <div class="preset" id="presetList"></div>
  </div>
</div>

<div class="card" id="c-area">
  <h2>エリア<span class="arw">▼</span></h2>
  <div class="body">
    <div class="row" style="align-items:flex-end">
      <select id="pref" hidden></select>
      <div class="modebar">
        <label class="modebtn"><input type="radio" name="mode" value="city" checked><span>区市町村で探す</span></label>
        <label class="modebtn"><input type="radio" name="mode" value="rail"><span>沿線・駅で探す</span></label>
      </div>
    </div>

    <div id="cityMode">
      <div class="row" style="margin-top:12px">
        <div class="fld" style="max-width:260px">
          <label>区市町村をしぼり込み</label>
          <input type="text" id="cityFilter" placeholder="例: 新宿 / 世田谷 / 武蔵野">
        </div>
      </div>
      <div class="tools" style="margin:10px 0 6px">
        <button onclick="allCities(true)">表示中をすべて選択</button>
        <button onclick="allCities(false)">選択をすべて解除</button>
        <span class="mini" id="cityCount"></span>
      </div>
      <div class="grid" id="cities"></div>
    </div>

    <div id="railMode" hidden>
      <div class="row" style="margin-top:12px">
        <div class="fld" style="max-width:300px">
          <label>駅名で検索</label>
          <input type="text" id="stFilter" placeholder="例: 新宿 / 中野 / 吉祥寺">
        </div>
        <div class="fld" style="justify-content:flex-end;flex:none;min-width:0">
          <button class="primary mapbtn" type="button" onclick="openStationMap()">🗺 地図から駅を選ぶ</button>
        </div>
        <div class="fld" style="justify-content:flex-end">
          <label class="chk" style="padding-left:0">
            <input type="checkbox" id="allLines" checked>
            <span>同じ駅を通る他の路線もURLに含める<br>
              <span class="mini">SUUMOは同じ駅としてまとめるため、外しても検索結果は変わりません</span></span>
          </label>
        </div>
      </div>
      <div id="stResults" class="grid" style="margin-top:6px"></div>

      <div class="sub">選んだ駅・路線 <span class="mini" id="railCount"></span></div>
      <div class="preset" id="railPicked"></div>

      <div class="sub">路線から選ぶ（<span id="railPrefName"></span>を通る82路線）</div>
      <div class="tools">
        <input type="text" id="lineFilter" placeholder="路線名でしぼり込み" style="max-width:240px">
        <button onclick="clearRail()">駅・路線の選択を解除</button>
      </div>
      <div id="lineList"></div>
    </div>
  </div>
</div>

<div class="card" id="c-basic">
  <h2>賃料・間取り・広さ<span class="arw">▼</span></h2>
  <div class="body">
    <div class="row">
      <div class="fld"><label>賃料 下限</label><select id="cb"></select></div>
      <div class="fld"><label>賃料 上限</label><select id="ct"></select></div>
      <div class="fld"><label>専有面積 下限</label><select id="mb"></select></div>
      <div class="fld"><label>専有面積 上限</label><select id="mt"></select></div>
    </div>

/* --- 沿線・駅データの索引を作る --- */
const ST_NAME = {};                       // 駅ID(5桁) -> 駅名
RAIL_STATIONS.split(",").forEach(x=>{ ST_NAME[x.slice(0,5)] = x.slice(5); });
const LINE = {};                          // 路線コード -> {n:路線名, ar:エリア, ids:[駅ID]}
const ST_LINES = {};                      // 駅ID -> [路線コード]（同じ駅を通る路線）
RAIL_LINES.forEach(row=>{
  const f = row.split("|");
  const ids = f[3].match(/.{5}/g) || [];
  LINE[f[0]] = {n:f[2], ar:f[1], ids};
  ids.forEach(i=>{ (ST_LINES[i] = ST_LINES[i] || []).push(f[0]); });
});
const PREF_RN = {};                       // 都道府県コード -> [路線コード]
for(const ta in RAIL_PREF_LINES) PREF_RN[ta] = RAIL_PREF_LINES[ta].split(",").filter(Boolean);

let droppedSt = []; // 選択中の都道府県では検索できない駅ID
let pickedSt = [];   // 選んだ駅ID
let pickedRn = [];   // 路線ごと選んだ路線コード
let openLines = {};  // 駅一覧を開いている路線

function mode(){ return document.querySelector('input[name=mode]:checked').value; }
function lineNamesOf(id){ return (ST_LINES[id]||[]).map(rn=>LINE[rn].n); }

/* 駅名検索。選択中の都道府県を通る路線の駅を先に出す */
function renderStResults(){
  const q = $("stFilter").value.trim();
  if(!q){ $("stResults").innerHTML = '<div class="mini" style="grid-column:1/-1">駅名を入力すると候補が出ます。選ぶと、その駅を通る路線がまとめて条件に入ります。都内の路線であれば、川崎・横浜・大宮など都外の駅も選べます。</div>'; return; }
  const near = new Set(PREF_RN[$("pref").value] || []);
  const hit = [];
  for(const id in ST_NAME){
    const n = ST_NAME[id];
    if(!n.includes(q)) continue;
    const lns = ST_LINES[id] || [];
    hit.push({id, n, lns, score: (n===q?0:n.startsWith(q)?1:2) - (lns.some(r=>near.has(r))?0.5:0)});
  }
  hit.sort((a,b)=> a.score-b.score || a.n.length-b.n.length || a.n.localeCompare(b.n,"ja"));
  if(!hit.length){ $("stResults").innerHTML = '<div class="mini" style="grid-column:1/-1">「'+q+'」に一致する駅がありません</div>'; return; }
  $("stResults").innerHTML = hit.slice(0,60).map(h=>{
    const on = pickedSt.includes(h.id);
    const ln = h.lns.map(r=>LINE[r].n);
    const label = ln.slice(0,2).join("・") + (ln.length>2 ? " ほか"+(ln.length-2)+"路線" : "");
    return '<button class="stcard" data-id="'+h.id+'" onclick="addSt(this.dataset.id)">'+
           '<b>'+h.n+(on?" ✓":"")+'</b><i>'+label+'</i></button>';
  }).join("") + (hit.length>60 ? '<div class="mini" style="grid-column:1/-1">ほか'+(hit.length-60)+'駅（絞り込んでください）</div>' : "");
}

/* その駅を通る路線を持つ都道府県。SUUMOはエリア(ar)が一致しないと駅が無視されるので、
   検索対象の都道府県はこの中から選ぶ必要がある */
function prefsForStation(id){
  const lns = new Set(ST_LINES[id] || []);
  return AREAS.map(a=>a.ta)
    .map(ta=>({ta, n:(PREF_RN[ta]||[]).filter(rn=>lns.has(rn)).length}))
    .filter(x=>x.n > 0)
    .sort((a,b)=>b.n - a.n)          // その駅の路線を最も多く持つ都道府県＝実際に駅がある県
    .map(x=>x.ta);
}
function stationFitsPref(id, ta){
  const lns = new Set(ST_LINES[id] || []);
  return (PREF_RN[ta]||[]).some(rn=>lns.has(rn));
}

function addSt(id){
  if(!pickedSt.includes(id)) pickedSt.push(id);
  let msg = ST_NAME[id] + "駅を追加（" + (ST_LINES[id]||[]).length + "路線）";
  if(!stationFitsPref(id, $("pref").value)){
    const ta = prefsForStation(id)[0];
    if(ta){
      $("pref").value = ta; scKeep = []; openLines = {};
      $("cityFilter").value = ""; renderCities();
      msg = ST_NAME[id] + "駅に合わせて都道府県を" + AREAS.find(a=>a.ta===ta).n + "に切り替えました";
    }
  }
  renderRail(); update();
  toast(msg);
}
function delSt(id){ pickedSt = pickedSt.filter(x=>x!==id); renderRail(); update(); }
function toggleRn(rn, on){
  pickedRn = pickedRn.filter(x=>x!==rn);
  if(on) pickedRn.push(rn);
  renderRail(); update();
}
/* ---------- 地図から駅を選ぶ（全駅を1枚の地図に表示） ---------- */
const ST_GEO = {};
RAIL_GEO.split(",").forEach(x=>{
  const f = x.split("|");
  ST_GEO[f[0]] = [GEO_LAT0 + parseInt(f[1],36)/1e5, GEO_LON0 + parseInt(f[2],36)/1e5];
});
const GEO_IDS = Object.keys(ST_GEO);
const LABEL_ZOOM = 13;                 // これ以上拡大すると駅名を常時表示
let stMap = null, dotLayer = null, nameLayer = null, dots = {};

function dotStyle(on, z){
  const r = z >= 15 ? 8 : z >= 13 ? 6.5 : z >= 11 ? 5 : 3.5;
  return on ? {radius:r+2, weight:2.5, color:"#fff", fillColor:"#00a040", fillOpacity:1}
            : {radius:r, weight: z>=11 ? 2.5 : 1.5, color:"#00a040", fillColor:"#fff", fillOpacity:1};
}

function openStationMap(){
  $("mapDlg").hidden = false;
  if(!stMap){
    stMap = L.map("lineMap", {zoomControl:true, preferCanvas:true, minZoom:5});
    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
      maxZoom:19, maxNativeZoom:18, minZoom:5,
      attribution:'出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>' +
                  ' ／ 駅位置：&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(stMap);
    dotLayer = L.layerGroup().addTo(stMap);
    nameLayer = L.layerGroup().addTo(stMap);
    GEO_IDS.forEach(id=>{
      const mk = L.circleMarker(ST_GEO[id], dotStyle(false, 12))
        .bindTooltip(ST_NAME[id], {direction:"top", offset:[0,-6]})
        .on("click", ()=>toggleStOnMap(id))
        .addTo(dotLayer);
      dots[id] = mk;
    });
    stMap.on("zoomend", restyleDots);
    stMap.on("moveend", drawNames);
    stMap.setView([35.6812, 139.7671], 12);
  }
  restyleDots();
  const place = ()=>{
    stMap.invalidateSize();
    // すでに選んだ駅があれば、それが見える範囲にする
    const sel = pickedSt.filter(id=>ST_GEO[id]).map(id=>ST_GEO[id]);
    if(sel.length === 1) stMap.setView(sel[0], Math.max(stMap.getZoom(), 14), {animate:false});
    else if(sel.length > 1) stMap.fitBounds(L.latLngBounds(sel).pad(0.3), {maxZoom:15, animate:false});
    drawNames();
  };
  place();
  setTimeout(place, 60);          // ダイアログの大きさが確定してから合わせ直す
  updateMapCount();
}

function restyleDots(){
  if(!stMap) return;
  const z = stMap.getZoom();
  GEO_IDS.forEach(id=>{
    const on = pickedSt.includes(id);
    dots[id].setStyle(dotStyle(on, z));
    if(on) dots[id].bringToFront();
  });
}

/* 駅名ラベルは表示範囲内だけ描く（1,269駅すべてに付けると重く読みにくいため） */
function drawNames(){
  if(!stMap) return;
  nameLayer.clearLayers();
  const z = stMap.getZoom();
  const b = stMap.getBounds().pad(0.1);
  const show = GEO_IDS.filter(id=>b.contains(ST_GEO[id]) && (z >= LABEL_ZOOM || pickedSt.includes(id)));
  if(show.length > 500) return;
  show.forEach(id=>{
    const on = pickedSt.includes(id);
    L.marker(ST_GEO[id], {
      icon: L.divIcon({className:"", iconSize:null,
        html:'<span class="stname'+(on?' on':'')+'">'+ST_NAME[id]+'</span>'}),
      keyboard:false
    }).on("click", ()=>toggleStOnMap(id)).addTo(nameLayer);
  });
}

function toggleStOnMap(id){
  if(pickedSt.includes(id)){
    delSt(id);
    toast(ST_NAME[id] + "駅を外しました");
  } else {
    addSt(id);                       // 「〇〇駅を追加」のお知らせは addSt が出す
  }
  restyleDots();
  drawNames();
  updateMapCount();
}

function updateMapCount(){
  const names = pickedSt.map(id=>ST_NAME[id]);
  $("mapCount").textContent = names.length
    ? "選んだ駅 " + names.length + "件：" + (names.length <= 8 ? names.join("・") : names.slice(0,8).join("・") + " ほか" + (names.length-8))
    : "まだ駅を選んでいません";
}

function closeLineMap(){ $("mapDlg").hidden = true; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("mapDlg").hidden) closeLineMap(); });
document.getElementById("mapDlg").addEventListener("click", e=>{ if(e.target.id==="mapDlg") closeLineMap(); });

function toggleOpen(rn){ openLines[rn] = !openLines[rn]; renderLineList(); }
function clearRail(){ pickedSt=[]; pickedRn=[]; renderRail(); update(); toast("駅・路線の選択を解除しました"); }

function renderRail(){
  const ta = $("pref").value;
  const chips = pickedSt.map(id=>{
    const n = (ST_LINES[id]||[]).filter(rn=>(PREF_RN[ta]||[]).includes(rn)).length;
    const bad = !stationFitsPref(id, ta);
    return '<span class="tag"'+(bad?' style="border-color:#d33;color:#d33" title="この都道府県では検索できません"':'')+'>'+
           ST_NAME[id]+'駅 <span class="mini">'+(bad?'対象外':n+'路線')+'</span>'+
           '<button data-id="'+id+'" onclick="delSt(this.dataset.id)" title="外す">×</button></span>';
  }).concat(pickedRn.map(rn=>
    '<span class="tag line">'+LINE[rn].n+' <span class="mini">全駅</span>'+
    '<button data-rn="'+rn+'" onclick="toggleRn(this.dataset.rn,false)" title="外す">×</button></span>'
  ));
  $("railPicked").innerHTML = chips.length ? chips.join("")
    : '<span class="mini">未選択です。駅も路線も選ばないと検索できません。</span>';
  $("railCount").textContent = pickedSt.length || pickedRn.length
    ? "駅" + pickedSt.length + "・路線" + pickedRn.length : "";
  renderStResults();
  renderLineList();
}

function renderLineList(){
  const ta = $("pref").value;
  const q = $("lineFilter").value.trim();
  $("railPrefName").textContent = AREAS.find(a=>a.ta===ta).n;
  const rns = (PREF_RN[ta] || []).filter(rn=>!q || LINE[rn].n.includes(q));
  if(!rns.length){ $("lineList").innerHTML = '<div class="mini">該当する路線がありません</div>'; return; }
  $("lineList").innerHTML = rns.map(rn=>{
    const L = LINE[rn], open = !!openLines[rn];
    const picked = L.ids.filter(i=>pickedSt.includes(i)).length;
    const stations = open ? '<div class="lst grid">' + L.ids.map(i=>
        '<label class="chk"><input type="checkbox" data-id="'+i+'"'+
        (pickedSt.includes(i)?" checked":"")+' onchange="onStBox(this)"><span>'+ST_NAME[i]+'</span></label>'
      ).join("") + '</div>' : "";
    return '<div class="lrow"><div class="lhead">'+
      '<label class="chk"><input type="checkbox" data-rn="'+rn+'"'+(pickedRn.includes(rn)?" checked":"")+
      ' onchange="toggleRn(this.dataset.rn,this.checked)"><span>'+L.n+
      ' <span class="mini">'+L.ids.length+'駅'+(picked?"・"+picked+"駅選択中":"")+'</span></span></label>'+
      '<button class="lnk" data-rn="'+rn+'" onclick="toggleOpen(this.dataset.rn)">'+
      (open?"駅を閉じる ▲":"駅を選ぶ ▼")+'</button></div>'+stations+'</div>';
  }).join("");
}

function onStBox(el){
  const id = el.dataset.id;
  if(el.checked){ if(!pickedSt.includes(id)) pickedSt.push(id); }
  else pickedSt = pickedSt.filter(x=>x!==id);
  renderRail(); update();
}

/* 駅IDを ek（路線コード+駅ID）に変換する。
   「他の路線も含める」がOFFのときは、選択中の都道府県を通る路線を優先して1つだけ使う */
function ekFor(id, ta){
  const near = new Set(PREF_RN[ta] || []);
  const lns = (ST_LINES[id] || []).filter(rn=>near.has(rn));
  if(!lns.length) return [];                       // この都道府県では検索できない駅
  return $("allLines").checked ? lns.map(rn=>rn+id) : [lns[0] + id];
}

/* 選択済みだが表示されていない市区町村も保持するための保管庫 */
let scKeep = [];
function syncSc(){
  const shown = new Set([...document.querySelectorAll('input[name=sc]')].map(i=>i.value));
  const on = new Set(selected("sc"));
  scKeep = scKeep.filter(v=>!shown.has(v)).concat([...on]);

function getState(){
  syncSc();
  const st = {ta:$("pref").value, sc:scKeep.slice(), fw2:$("fw2").value.trim(),
              mode:mode(), ek:pickedSt.slice(), rn:pickedRn.slice(), al:$("allLines").checked};
  for(const id in SELECTS) st[id] = $(id).value;
  for(const id in CHECKS)  st[id] = selected(id);

  st.shkk1 = selected("shkk1"); st.shkk2 = selected("shkk2");
  st.shkk3 = selected("shkk3"); st.shkk4 = selected("shkk4");
  return st;
}

function setState(st){
  if(!st) return;
  if(st.ta && AREAS.some(a=>a.ta===st.ta)) $("pref").value = st.ta;
  const m = (st.mode === "rail") ? "rail" : "city";
  document.querySelector('input[name=mode][value="'+m+'"]').checked = true;
  pickedSt = (st.ek||[]).filter(id=>ST_NAME[id]);
  pickedRn = (st.rn||[]).filter(rn=>LINE[rn]);
  $("allLines").checked = (st.al !== false);
  applyMode();
  for(const id in SELECTS) $(id).value = (st[id] !== undefined) ? st[id] : SELECTS[id].def;
  // 別の都道府県で保存した条件を読み込んでも壊れないよう、対象外の市区町村コードは捨てる
  const valid = new Set(currentPref().c.split(",").map(x=>x.slice(0,5)));
  scKeep = (st.sc||[]).filter(c=>valid.has(c));
  $("cityFilter").value = "";
  renderCitiesFromKeep();
  for(const id in CHECKS) setChecks(id, st[id]);
  setChecks("tc", st.tc);
  ["shkk1","shkk2","shkk3","shkk4"].forEach(k=>setChecks(k, st[k]));
  $("fw2").value = st.fw2 || "";
  renderRail();
  update();
}

}

/* ---------- URL生成 ---------- */
function buildUrl(){
  const st = getState();
  const pref = AREAS.find(a=>a.ta===st.ta);
  const rail = st.mode === "rail";
  droppedSt = [];
  const p = new URLSearchParams();
  p.append("ar", pref.ar);
  p.append("bs", "040");           // 040 = 賃貸
  if(rail){
    p.append("ra", "0" + st.ta);   // 沿線検索では都道府県は ra で渡す
    let rns = st.rn.slice();
    const eks = [], push = e=>{ if(!eks.includes(e)) eks.push(e); };
    // rn(路線まるごと) と ek(駅指定) を混ぜると SUUMO 側で ek が無視されるので、
    // 併用時は路線をその路線の全駅に展開する（rn 指定と同じ結果になることを確認済み）
    if(st.ek.length && rns.length){
      rns.forEach(rn=>LINE[rn].ids.forEach(i=>push(rn + i)));
      rns = [];
    }
    droppedSt = [];
    st.ek.forEach(id=>{
      const eks = ekFor(id, st.ta);
      if(!eks.length) droppedSt.push(id); else eks.forEach(push);
    });
    rns.forEach(rn=>p.append("rn", rn));
    eks.forEach(ek=>p.append("ek", ek));
  } else {
    p.append("ta", st.ta);
    st.sc.forEach(v=>p.append("sc", v));
  }
  p.append("cb", st.cb); p.append("ct", st.ct);
  p.append("mb", st.mb); p.append("mt", st.mt);
  p.append("cn", st.cn); p.append("et", st.et);
  st.md.forEach(v=>p.append("md", v));
  st.ts.forEach(v=>p.append("ts", v));
  st.kz.forEach(v=>p.append("kz", v));
  st.co.forEach(v=>p.append("co", v));
  st.tc.forEach(v=>p.append("tc", v));
  ["shkk1","shkk2","shkk3","shkk4"].forEach(k=>st[k].forEach(v=>p.append(k, v)));
  p.append("shkr1","03"); p.append("shkr2","03"); p.append("shkr3","03"); p.append("shkr4","03");
  p.append("fw2", st.fw2);
  p.append("srch_navi","1");
  p.append("po1", st.po1); p.append("po2","99");
  p.append("pc", st.pc);
  const page = rail ? "FR301FC005" : "FR301FC001";
  return "https://suumo.jp/jj/chintai/ichiran/" + page + "/?" + p.toString();
}

function labelOf(list, v){ const f=list.find(x=>x[0]===v); return f?f[1]:v; }

function summary(){
  const st = getState();
  const pref = AREAS.find(a=>a.ta===st.ta);
  const cityMap = {};
  pref.c.split(",").forEach(s=>cityMap[s.slice(0,5)]=s.slice(5));
  const parts = [];
  if(st.mode === "rail"){
    const names = st.ek.map(id=>ST_NAME[id]+"駅").concat(st.rn.map(rn=>LINE[rn].n+"（全駅）"));
    parts.push(names.length ? (names.length<=5 ? names.join("・")
                              : names.slice(0,5).join("・") + " ほか" + (names.length-5))
                            : "駅・路線が未選択");
    if(droppedSt.length) parts.push("⚠ " + droppedSt.map(id=>ST_NAME[id]).join("・") +
      "駅は" + pref.n + "の検索に含められません（都道府県を切り替えてください）");
  } else {
    parts.push(pref.n + (st.sc.length ? "／" + (st.sc.length<=4
        ? st.sc.map(c=>cityMap[c]||c).join("・")
        : st.sc.length + "市区町村") : "（全域）"));
  }
  const cbL = labelOf(SELECTS.cb.opts, st.cb), ctL = labelOf(SELECTS.ct.opts, st.ct);
  if(st.cb!=="0.0" || st.ct!=="9999999") parts.push("賃料 " + cbL + "〜" + ctL);
  if(st.mb!=="0" || st.mt!=="9999999")
    parts.push("面積 " + labelOf(SELECTS.mb.opts, st.mb) + "〜" + labelOf(SELECTS.mt.opts, st.mt));
  if(st.cn!=="9999999") parts.push("築" + labelOf(SELECTS.cn.opts, st.cn));
  if(st.et!=="9999999") parts.push("駅徒歩" + labelOf(SELECTS.et.opts, st.et));
  if(st.md.length) parts.push(st.md.map(v=>labelOf(CHECKS.md, v)).join("・"));
  if(st.ts.length) parts.push(st.ts.map(v=>labelOf(CHECKS.ts, v)).join("・"));
  if(st.kz.length) parts.push(st.kz.map(v=>labelOf(CHECKS.kz, v)).join("・"));
  if(st.co.length) parts.push(st.co.map(v=>labelOf(CHECKS.co, v)).join("・"));
  const tcAll = TC_GROUPS.reduce((a,g)=>a.concat(g[1]), []);
  if(st.tc.length) parts.push(st.tc.map(v=>labelOf(tcAll, v)).join("・"));
  const shk = ["shkk1","shkk2","shkk3","shkk4"].reduce((a,k)=>a.concat(st[k]),[]);
  if(shk.length) parts.push(shk.map(v=>{const f=SHKK.find(s=>s[1]===v); return f?f[2]:v;}).join("・"));
  if(st.fw2) parts.push("「" + st.fw2 + "」");
  return parts.join("　/　");
}

function update(){
  const railEmpty = mode()==="rail" && !pickedSt.length && !pickedRn.length;
  const u = buildUrl();
  $("url").textContent = railEmpty ? "駅または路線を選んでください" : u;
  $("url").style.color = railEmpty ? "var(--accent)" : "";
  $("summary").textContent = summary();
  const shown = document.querySelectorAll('input[name=sc]').length;
  $("cityCount").textContent = scKeep.length ? scKeep.length + "件選択中（表示 " + shown + "件）"
                                             : "未選択なら東京都全域が対象です";
  $("tcCount").textContent = selected("tc").length ? selected("tc").length + "件選択中" : "";
  syncHash();
}

/* 条件をURLハッシュにも保存する（このページ自体をブックマークすれば条件が復元される） */
function syncHash(){
  try{
    const bytes = new TextEncoder().encode(JSON.stringify(getState()));
    let bin = ""; bytes.forEach(b=>bin += String.fromCharCode(b));
    history.replaceState(null, "", "#" + btoa(bin));
  }catch(e){}
}
function readHash(){
  if(location.hash.length < 3) return null;
  try{
    const bin = atob(location.hash.slice(1));
    const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}

/* ---------- 操作 ---------- */
function railReady(){
  if(mode()==="rail" && !pickedSt.length && !pickedRn.length){
    toast("駅または路線を選んでください"); return false;
  }
  return true;
}
function openUrl(){ if(railReady()) window.open(buildUrl(), "_blank", "noopener"); }

function copyUrl(){
  if(!railReady()) return;
  const t = buildUrl();
  navigator.clipboard.writeText(t).then(()=>toast("URLをコピーしました"),
    ()=>{ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a);
          a.select(); document.execCommand("copy"); a.remove(); toast("URLをコピーしました"); });

/* ---------- 保存した条件 ---------- */
function loadPresets(){ try{ return JSON.parse(localStorage.getItem(LS_PRESETS)) || []; }catch(e){ return []; } }
function storePresets(p){ try{ localStorage.setItem(LS_PRESETS, JSON.stringify(p)); }catch(e){} }

function savePreset(){
  const name = $("presetName").value.trim();
  if(!name){ toast("条件名を入力してください"); $("presetName").focus(); return; }
  const list = loadPresets().filter(p=>p.name!==name);
  list.push({name, state:getState()});
  storePresets(list); renderPresets(); $("presetName").value="";
  toast("「"+name+"」を保存しました");
}

function applyPreset(name){
  const p = loadPresets().find(p=>p.name===name);
  if(p){ setState(p.state); toast("「"+name+"」を読み込みました"); }
}

function delPreset(name){
  storePresets(loadPresets().filter(p=>p.name!==name));
  renderPresets(); toast("「"+name+"」を削除しました");
}

function renderPresets(){
  const list = loadPresets();
  $("presetList").innerHTML = list.length
    ? list.map(p=>'<span class="tag"><a href="#" onclick="applyPreset(this.dataset.n);return false" '+
        'data-n="'+p.name.replace(/"/g,"&quot;")+'" style="color:inherit;text-decoration:none">'+
        p.name.replace(/</g,"&lt;")+'</a><button title="削除" onclick="delPreset(this.dataset.n)" '+
        'data-n="'+p.name.replace(/"/g,"&quot;")+'">×</button></span>').join("")
    : '<span class="mini">まだ保存された条件はありません。よく使う条件に名前をつけて保存しておくと1クリックで呼び出せます。</span>';
}

function saveDefault(){
  try{ localStorage.setItem(LS_DEFAULT, JSON.stringify(getState())); toast("この条件を初期条件にしました"); }
  catch(e){ toast("保存できませんでした"); }
}

function filterTc(){
  const q = $("tcFilter").value.trim();
  document.querySelectorAll("#tcWrap .tcg").forEach(g=>{
    let hit = 0;
    g.querySelectorAll(".chk").forEach(l=>{
      const on = !q || l.textContent.includes(q);
      l.style.display = on ? "" : "none";
      if(on) hit++;
    });
    g.style.display = hit ? "" : "none";
  });
}

function applyMode(){
  const rail = mode()==="rail";
  $("cityMode").hidden = rail;
  $("railMode").hidden = !rail;
}

/* ---------- 初期化 ---------- */
buildUI();
renderRail();
applyMode();
renderPresets();
const fromHash = readHash();
if(fromHash){ setState(fromHash); }
else { try{ const d = JSON.parse(localStorage.getItem(LS_DEFAULT)); if(d) setState(d); }catch(e){} }
update();
if(!STORAGE_OK){
  $("presetList").insertAdjacentHTML("beforebegin",
    '<div class="mini" style="margin-bottom:6px">※ このブラウザでは条件を保存できません（プライベートモードなどでlocalStorageが無効）。' +
    'アドレスバーのURLに条件が入っているので、ページごとブックマークすれば条件を残せます。</div>');
}

$("pref").addEventListener("change", ()=>{
  scKeep=[]; $("cityFilter").value=""; openLines={};
  renderCities(); renderRail();
});
document.querySelectorAll('input[name=mode]').forEach(r=>
  r.addEventListener("change", ()=>{ applyMode(); update(); }));
$("stFilter").addEventListener("input", renderStResults);
$("lineFilter").addEventListener("input", renderLineList);
$("cityFilter").addEventListener("input", ()=>{ syncSc(); renderCitiesFromKeep(); update(); });
$("tcFilter").addEventListener("input", filterTc);
$("fw2").addEventListener("input", update);
document.addEventListener("change", e=>{
  if(e.target.matches("input,select")) update();
});
document.querySelectorAll(".card>h2").forEach(h=>{
  h.addEventListener("click", ()=>h.parentElement.classList.toggle("closed"));
});
$("presetName").addEventListener("click", e=>e.stopPropagation());
</script>
</body>
</html>
