<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京路線マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  display: flex; height: 100vh; overflow: hidden;
  background: #0d0d14; color: #e8e4f0;
}

/* ══ サイドバー共通 ══ */
.sidebar {
  display: flex; flex-direction: column; overflow: hidden;
  z-index: 200; transition: width 0.25s ease, min-width 0.25s ease;
  flex-shrink: 0;
}
.sidebar.collapsed { width: 0 !important; min-width: 0 !important; border: none !important; }

/* 開閉ボタン */
.toggle-sidebar-btn {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 18px; height: 48px;
  background: #232838; border: 1px solid #3a4060;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: #7880a0; font-size: 10px; z-index: 500;
  transition: background 0.15s, color 0.15s, left 0.25s ease, right 0.25s ease;
  user-select: none;
}
.toggle-sidebar-btn:hover { background: #2e3650; color: #c8d0f0; }
#toggle-left { border-radius: 0 5px 5px 0; border-left: none; }

/* ══ 左サイドバー ══ */
#sidebar-left {
  width: 260px; min-width: 260px;
  background: #181e2e; border-right: 1px solid #2a3048;
}
#sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid #2a3048; background: #111624; flex-shrink: 0; }
#sidebar-header h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #e8ecff; margin-bottom: 2px; }
#sidebar-header p  { font-size: 10px; color: #5a6280; }

/* 検索エリア（左サイドバー内） */
#search-area { padding: 12px 14px 10px; border-bottom: 1px solid #2a3048; flex-shrink: 0; }
#search-area h2 { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5a6280; margin-bottom: 8px; }
#search-wrap { position: relative; margin-bottom: 7px; }
#station-input {
  width: 100%; padding: 7px 10px;
  background: #1e2438; border: 1px solid #2e3858; border-radius: 6px;
  color: #e8ecff; font-size: 12px; font-family: inherit; outline: none;
  transition: border-color 0.15s;
}
#station-input:focus { border-color: #5060c0; }
#station-input::placeholder { color: #3a4260; }
#autocomplete-list {
  position: absolute; top: calc(100% + 3px); left: 0; right: 0;
  background: #1e2848; border: 1px solid #3a4868; border-radius: 6px;
  max-height: 180px; overflow-y: auto; z-index: 400; display: none;
}
#autocomplete-list::-webkit-scrollbar { width: 3px; }
#autocomplete-list::-webkit-scrollbar-thumb { background: #3a4868; border-radius: 2px; }
.ac-item { padding: 6px 10px; font-size: 11px; color: #b0b8d8; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.1s; }
.ac-item:hover, .ac-item.selected { background: #283060; color: #e8ecff; }
.ac-dots { display: flex; gap: 3px; flex-shrink: 0; flex-wrap: wrap; max-width: 36px; }
.ac-dot  { width: 6px; height: 6px; border-radius: 50%; }
#search-btn {
  width: 100%; padding: 7px 0;
  background: #1e2c58; border: 1px solid #3848a8; border-radius: 6px;
  color: #8898e8; font-size: 11px; font-family: inherit; cursor: pointer;
  transition: all 0.15s; letter-spacing: 0.04em;
}
#search-btn:hover:not(:disabled) { background: #283878; color: #c0ccff; border-color: #5068d8; }
#search-btn:disabled { opacity: 0.3; cursor: default; }
#search-result { display: none; padding: 8px 14px; border-bottom: 1px solid #2a3048; background: #141a2c; flex-shrink: 0; }
#result-station-name { font-size: 12px; font-weight: 700; color: #e8ecff; margin-bottom: 5px; }
#result-lines-list { display: flex; flex-direction: column; gap: 3px; }
.result-line-tag { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 5px; background: #1e2848; font-size: 10px; color: #b0b8d8; }
.result-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.result-badge { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

.section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5a6280; padding: 10px 16px 6px; text-transform: uppercase; white-space: nowrap; }
#lines-container { overflow-y: auto; flex: 1; padding-bottom: 10px; }
#lines-container::-webkit-scrollbar { width: 3px; }
#lines-container::-webkit-scrollbar-thumb { background: #2a3248; border-radius: 2px; }

.line-item { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; transition: background 0.15s; user-select: none; white-space: nowrap; }
.line-item:hover  { background: #1e2840; }
.line-item.active { background: #222e4a; }

/* line-dot を廃止してアイコンのみに */
.line-badge {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900; letter-spacing: -0.02em;
  border: 1.5px solid rgba(255,255,255,0.15);
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  opacity: 0.45; transition: opacity 0.15s, box-shadow 0.15s;
}
.line-item.active .line-badge { opacity: 1; box-shadow: 0 0 8px var(--glow-color); }

.line-name  { font-size: 12px; color: #9098b8; flex: 1; }
.line-item.active .line-name  { color: #e8ecff; }
.line-count { font-size: 10px; color: #3a4260; font-variant-numeric: tabular-nums; }
.line-item.active .line-count { color: #6878a8; }

.toggle-sw { width: 28px; height: 16px; background: #1e2438; border-radius: 8px; position: relative; flex-shrink: 0; transition: background 0.2s; border: 1px solid #2a3258; }
.toggle-sw::after { content: ''; position: absolute; width: 10px; height: 10px; background: #3a4268; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s, background 0.2s; }
.line-item.active .toggle-sw { background: var(--toggle-color); border-color: transparent; }
.line-item.active .toggle-sw::after { transform: translateX(12px); background: #fff; }

#ctrl-bar { padding: 10px 14px; border-top: 1px solid #2a3048; display: flex; gap: 6px; flex-shrink: 0; }
.ctrl-btn { flex: 1; padding: 6px 0; background: #1e2438; border: 1px solid #2e3858; border-radius: 6px; color: #6878a8; font-size: 11px; cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap; }
.ctrl-btn:hover { background: #28304e; color: #b0b8d8; border-color: #3a4868; }
.section-divider { height: 1px; background: #222a3e; margin: 4px 14px; }

/* ══ 中央カラム（地図＋下バー） ══ */
#center-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ══ 地図 ══ */
#map { flex: 1; background: #1a1a2a; min-width: 0; min-height: 0; }
.leaflet-container { background: #1a1a2a; }
.leaflet-tile { filter: brightness(0.35) saturate(0.4) hue-rotate(200deg); }

/* ══ 下バー ══ */
#bottom-bar {
  flex-shrink: 0; height: 72px;
  background: #111624; border-top: 1px solid #2a3048;
  display: none; flex-direction: column;
  overflow: hidden; position: relative;
}
#bottom-bar.visible { display: flex; }

/* タブ行 */
#bb-tabs {
  display: flex; gap: 0; height: 26px; flex-shrink: 0;
  border-bottom: 1px solid #1e2438; overflow-x: auto; overflow-y: hidden;
}
#bb-tabs::-webkit-scrollbar { height: 0; }
.bb-tab {
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px; height: 100%; cursor: pointer;
  font-size: 10px; color: #5a6280; white-space: nowrap;
  border-right: 1px solid #1e2438; transition: background 0.12s, color 0.12s;
  user-select: none; flex-shrink: 0;
}
.bb-tab:hover { background: #1a2038; color: #b0b8d8; }
.bb-tab.active { background: #1e2848; color: #e8ecff; border-bottom: 2px solid var(--tab-color, #fff); }
.bb-tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.bb-tab-close {
  margin-left: 3px; width: 13px; height: 13px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; color: #3a4260; transition: background 0.1s, color 0.1s;
}
.bb-tab-close:hover { background: #3a4868; color: #e8ecff; }

/* 駅リスト行 */
#bb-station-row {
  flex: 1; display: flex; align-items: center;
  padding: 0 8px; overflow-x: auto; gap: 0;
  scrollbar-width: none;
}
#bb-station-row::-webkit-scrollbar { height: 0; }

.bb-arrow {
  flex-shrink: 0; padding: 0 5px; font-size: 11px;
  color: #2e3858; user-select: none; line-height: 1;
}
.bb-station {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  padding: 0 5px; cursor: pointer; position: relative;
}
.bb-station:hover .bb-sname { color: #e8ecff; }
.bb-sname {
  font-size: 10px; color: #6878a8; white-space: nowrap;
  transition: color 0.12s; margin-top: 3px;
}
.bb-sdot {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.15);
  transition: transform 0.12s;
}
.bb-station.highlighted .bb-sdot { transform: scale(1.5); box-shadow: 0 0 6px var(--line-color,#fff); }
.bb-station.highlighted .bb-sname { color: #fff; font-weight: 700; }
.bb-station.highlighted::after {
  content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 2px); height: 2px; border-radius: 1px;
  background: var(--line-color, #fff);
}
.bb-conn { flex-shrink: 0; align-self: center; height: 2px; width: 16px; opacity: 0.4; margin-bottom: 13px; }

.always-marker { background: transparent; border: none; box-shadow: none; }
.always-dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.5);
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 0 3px rgba(0,0,0,0.8);
}
.always-dot:hover { transform: scale(1.8); box-shadow: 0 0 8px rgba(255,255,255,0.5); }
/* 乗り換え駅 — ダイヤ形 */
.always-dot.transfer {
  width: 10px; height: 10px; border-radius: 2px;
  transform: rotate(45deg); border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 0 5px rgba(255,255,255,0.3);
}
.always-dot.transfer:hover { transform: rotate(45deg) scale(1.7); box-shadow: 0 0 10px rgba(255,255,255,0.6); }

/* 乗り換え候補ハイライト — 削除 */

.station-label { background: transparent; border: none; box-shadow: none; font-family: 'Hiragino Sans','Noto Sans JP',sans-serif; }
.station-label-inner { font-size: 10px; color: #f0ecff; white-space: nowrap; text-shadow: 0 0 4px #000, 0 1px 3px #000; padding: 1px 3px; }
</style>
</head>

<button class="toggle-sidebar-btn" id="toggle-left" onclick="toggleSidebar('left')" title="閉じる">◀</button>

<div id="sidebar-left" class="sidebar">
  <div id="sidebar-header">
    <h1>東京路線マップ</h1>

  </div>

  <div id="search-area">

      <div id="autocomplete-list"></div>
    </div>
    <button id="search-btn" disabled>この駅の路線をオンにする</button>
  </div>
  <div id="search-result">
    <div id="result-station-name"></div>
    <div id="result-lines-list"></div>
  </div>

  <div id="lines-container">
    <div class="section-label">東京メトロ</div>
    <div id="metro-lines"></div>
    <div class="section-divider"></div>
    <div class="section-label">都営地下鉄</div>
    <div id="toei-lines"></div>
    <div class="section-divider"></div>
    <div class="section-label">JR・私鉄</div>
    <div id="jr-lines"></div>
    <div class="section-divider"></div>
    <div class="section-label">東急電鉄</div>
    <div id="tokyu-lines"></div>
    <div class="section-divider"></div>
    <div class="section-label">モノレール・新交通</div>
    <div id="mono-lines"></div>
  </div>
  <div id="ctrl-bar">
    <button class="ctrl-btn" onclick="toggleAll(true)">すべてオン</button>
    <button class="ctrl-btn" onclick="toggleAll(false)">すべてオフ</button>
  </div>
</div>

<div id="center-col">
  <div id="map"></div>
  <div id="bottom-bar">
    <div id="bb-tabs"></div>
    <div id="bb-station-row"></div>
  </div>
</div>

  '有明テニスの森':'ありあけてにすのもり','市場前':'しじょうまえ','新豊洲':'しんとよす',
  '品川シーサイド':'しながわしーさいど','東京テレポート':'とうきょうてれぽーと',
  '国際展示場':'こくさいてんじじょう','東雲':'しののめ'
};

/* ローマ字変換テーブル（ひらがな→ローマ字） */
const HIRA_TO_ROMA = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o',
  'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
  'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
  'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
  'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
  'や':'ya','ゆ':'yu','よ':'yo',
  'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
  'わ':'wa','を':'wo','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
  'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
  'だ':'da','ぢ':'di','づ':'du','で':'de','ど':'do',
  'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo',
  'しゃ':'sha','しゅ':'shu','しょ':'sho',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho',
  'にゃ':'nya','にゅ':'nyu','にょ':'nyo',
  'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',
  'みゃ':'mya','みゅ':'myu','みょ':'myo',
  'りゃ':'rya','りゅ':'ryu','りょ':'ryo',
  'ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'じゃ':'ja','じゅ':'ju','じょ':'jo',
  'びゃ':'bya','びゅ':'byu','びょ':'byo',
  'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
  'っ':'t','ー':'-','・':' ','〜':'~','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o',
  'ゃ':'ya','ゅ':'yu','ょ':'yo','ゎ':'wa','ゐ':'i','ゑ':'e'
};

function hiraToRoma(str){
  let result='';
  for(let i=0;i<str.length;i++){
    const two=str.slice(i,i+2);
    if(HIRA_TO_ROMA[two]){result+=HIRA_TO_ROMA[two];i++;continue;}
    result+=HIRA_TO_ROMA[str[i]]||str[i];
  }
  return result;
}

/* 検索用インデックス：駅名 → {yomi, roma} */
const stationSearchIndex={};
ALL_STATION_NAMES.forEach(name=>{
  const yomi=YOMI[name]||'';
  stationSearchIndex[name]={yomi, roma: hiraToRoma(yomi)};
});

function searchStations(q){
  if(!q) return [];
  const lq=q.toLowerCase();
  const results=[];
  ALL_STATION_NAMES.forEach(name=>{
    const {yomi,roma}=stationSearchIndex[name];
    if(name.startsWith(q)||name.includes(q)) results.push({name,priority:name.startsWith(q)?0:1});
    else if(yomi && (yomi.startsWith(lq)||yomi.includes(lq))) results.push({name,priority:yomi.startsWith(lq)?2:3});
    else if(roma && (roma.startsWith(lq)||roma.includes(lq))) results.push({name,priority:roma.startsWith(lq)?4:5});
  });
  results.sort((a,b)=>a.priority-b.priority);
  return results.slice(0,10).map(r=>r.name);
}

/* ══ 乗り換え駅セット ══ */
const transferStations=new Set(
  Object.entries(stationIndex).filter(([,e])=>e.length>=2).map(([n])=>n)
);

/* ── 常時表示マーカー（全駅小ドット、乗り換え駅はダイヤ形） ── */
const alwaysLayer=L.layerGroup().addTo(map);
Object.entries(stationIndex).forEach(([name,entries])=>{
  const {lat,lng,color}=entries[0];
  const isTransfer=transferStations.has(name);
  const cls='always-dot'+(isTransfer?' transfer':'');
  const size=isTransfer?14:8;
  const icon=L.divIcon({
    className:'always-marker',
    html:`<div class="${cls}" style="background:${color};" title="${name}${isTransfer?' [乗換]':''}"></div>`,
    iconSize:[size,size],iconAnchor:[size/2,size/2]
  });
  const m=L.marker([lat,lng],{icon,zIndexOffset:isTransfer?0:-100}).addTo(alwaysLayer);
  m.on('click',()=>triggerStationSearch(name));
});

/* ── 路線オン時レイヤー ── */
function createLineLayer(line){
  const group=L.layerGroup();
  L.polyline(line.stations.map(s=>[s.lat,s.lng]),{color:line.color,weight:4,opacity:0.9,lineJoin:'round'}).addTo(group);
  line.stations.forEach(s=>{
    L.circleMarker([s.lat,s.lng],{radius:7,fillColor:line.color,color:'#fff',weight:2,opacity:1,fillOpacity:1}).addTo(group);
    L.marker([s.lat,s.lng],{
      icon:L.divIcon({className:'station-label',html:`<div class="station-label-inner">${s.name}</div>`,iconAnchor:[-6,6]}),
      interactive:false
    }).addTo(group);
  });
  return group;
}

/* ══ 下バー管理 ══ */
const bbTabs = document.getElementById('bb-tabs');
const bbRow  = document.getElementById('bb-station-row');
const bottomBar = document.getElementById('bottom-bar');
let activeBbTab = null; // 現在表示中の路線ID

function buildBottomBar(){
  const onLines = ALL_LINES.filter(l => activeLines[l.id]);
  bbTabs.innerHTML = '';
  if(!onLines.length){
    bottomBar.classList.remove('visible');
    activeBbTab = null;
    return;
  }
  bottomBar.classList.add('visible');
  // activeBbTabが有効でなければ最初の路線を選択
  if(!activeBbTab || !activeLines[activeBbTab]) activeBbTab = onLines[0].id;

  onLines.forEach(line=>{
    const tab = document.createElement('div');
    tab.className = 'bb-tab' + (line.id===activeBbTab?' active':'');
    tab.dataset.id = line.id;
    tab.style.setProperty('--tab-color', line.color);
    tab.innerHTML=`<div class="bb-tab-dot" style="background:${line.color};"></div>${line.name}<span class="bb-tab-close" data-id="${line.id}">✕</span>`;
    tab.addEventListener('click', e=>{
      if(e.target.classList.contains('bb-tab-close')){
        e.stopPropagation();
        setLine(e.target.dataset.id, false);
        return;
      }
      activeBbTab = line.id;
      buildBottomBar();
    });
    bbTabs.appendChild(tab);
  });
  renderBbStations(activeBbTab);
}

function renderBbStations(lineId, highlightName=null){
  const line = ALL_LINES.find(l=>l.id===lineId);
  if(!line){ bbRow.innerHTML=''; return; }
  const color = line.color;
  bbRow.innerHTML = '';

  // 両方向矢印を先頭に
  const arrL = document.createElement('div');
  arrL.className='bb-arrow'; arrL.textContent='◀';
  bbRow.appendChild(arrL);

  line.stations.forEach((s, i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'bb-station' + (s.name===highlightName?' highlighted':'');
    wrap.style.setProperty('--line-color', color);
    wrap.innerHTML=`<div class="bb-sdot" style="background:${color};color:${color};"></div><div class="bb-sname">${s.name}</div>`;
    wrap.addEventListener('click',()=>{
      map.setView([s.lat,s.lng],15);
      renderBbStations(lineId, s.name);
    });
    bbRow.appendChild(wrap);

    // 駅間コネクタ（最後以外）
    if(i < line.stations.length-1){
      const conn = document.createElement('div');
      conn.style.cssText=`width:18px;height:2px;background:${color};opacity:0.5;flex-shrink:0;align-self:center;margin-bottom:13px;`;
      bbRow.appendChild(conn);
    }
  });

  const arrR = document.createElement('div');
  arrR.className='bb-arrow'; arrR.textContent='▶';
  bbRow.appendChild(arrR);

  // ハイライト駅が見えるようにスクロール
  if(highlightName){
    const idx = line.stations.findIndex(s=>s.name===highlightName);
    if(idx>=0){
      setTimeout(()=>{
        const nodes = bbRow.querySelectorAll('.bb-station');
        if(nodes[idx]) nodes[idx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
      },50);
    }
  }
}

/* ── トグル ── */
function toggleLine(id,lineData){
  const item=document.getElementById(`item-${id}`);
  if(activeLines[id]){
    map.removeLayer(layerGroups[id]); delete activeLines[id]; item.classList.remove('active');
  } else {
    if(!layerGroups[id]) layerGroups[id]=createLineLayer(lineData);
    layerGroups[id].addTo(map); activeLines[id]=true; item.classList.add('active');
  }
  if(activeLines[id]) activeBbTab = id;
  buildBottomBar();
}
function setLine(id,on){
  const ld=ALL_LINES.find(l=>l.id===id); if(!ld) return;
  if(on&&!activeLines[id]) toggleLine(id,ld);
  if(!on&&activeLines[id]) toggleLine(id,ld);
}
function toggleAll(on){
  ALL_LINES.forEach(l=>{ if(on&&!activeLines[l.id]) toggleLine(l.id,l); if(!on&&activeLines[l.id]) toggleLine(l.id,l); });
  if(!on) clearSearchResult();
  buildBottomBar();
}

/* ── 検索結果クリア ── */
function clearSearchResult(){
  searchResult.style.display='none';
  resultName.textContent='';
  resultLinesList.innerHTML='';
  input.value='';
  selectedStation=null;
  searchBtn.disabled=true;
  prevSearchLineIds=[];
}

/* ── 左サイドバー構築 ── */
function buildLineItem(line){
  const ic=LINE_ICONS[line.id]||'?';
  const div=document.createElement('div');
  div.className='line-item'; div.id=`item-${line.id}`;
  div.style.setProperty('--glow-color',line.color+'88');
  div.style.setProperty('--toggle-color',line.color);
  div.innerHTML=`
    <div class="line-badge" style="background:${line.color};">${ic}</div>
    <span class="line-name">${line.name}</span>
    <span class="line-count">${line.stations.length}駅</span>
    <div class="toggle-sw"></div>`;
  div.addEventListener('click',()=>toggleLine(line.id,line));
  return div;
}
document.getElementById('metro-lines').append(...LINES.metro.map(buildLineItem));
document.getElementById('toei-lines').append(...LINES.toei.map(buildLineItem));
document.getElementById('jr-lines').append(...LINES.jr.map(buildLineItem));
document.getElementById('tokyu-lines').append(...TOKYU_LINES.map(buildLineItem));
document.getElementById('mono-lines').append(...MONO_LINES.map(buildLineItem));

/* ── 右サイドバーのアコーディオンは削除 ── */

/* ── 検索 ── */
const input=document.getElementById('station-input');
const acList=document.getElementById('autocomplete-list');
const searchBtn=document.getElementById('search-btn');
const searchResult=document.getElementById('search-result');
const resultName=document.getElementById('result-station-name');
const resultLinesList=document.getElementById('result-lines-list');
let selectedStation=null, acIndex=-1;

function showAC(val){
  if(!val.trim()){acList.style.display='none';return;}
  const matches=searchStations(val.trim());
  if(!matches.length){acList.style.display='none';return;}
  acList.innerHTML=matches.map((n,i)=>{
    const dots=(stationIndex[n]||[]).map(x=>`<div class="ac-dot" style="background:${x.color};"></div>`).join('');
    const yomi=stationSearchIndex[n]?.yomi||'';
    const hint=yomi?`<span style="font-size:9px;color:#5a6888;margin-left:2px;">${yomi}</span>`:'';
    return `<div class="ac-item" data-name="${n}" data-idx="${i}"><div class="ac-dots">${dots}</div>${n}${hint}</div>`;
  }).join('');
  acList.style.display='block'; acIndex=-1;
  acList.querySelectorAll('.ac-item').forEach(el=>{
    el.addEventListener('mousedown',e=>{e.preventDefault();selectStation(el.dataset.name);});
  });
}
function selectStation(name){
  input.value=name; selectedStation=name;
  acList.style.display='none'; searchBtn.disabled=false;
}

/* 前回の検索で開いた路線IDを記憶 */
let prevSearchLineIds = [];

function doSearch(name){
  if(!name||!stationIndex[name]) return;
  const entries=stationIndex[name];

  // 前回の検索でオンにした路線を、左サイドバーで手動オンにされていなければオフに
  prevSearchLineIds.forEach(id=>{
    // 今回の検索対象路線は除く
    if(!entries.find(e=>e.lineId===id)) setLine(id,false);
  });

  entries.forEach(e=>setLine(e.lineId,true));
  prevSearchLineIds = entries.map(e=>e.lineId);

  map.setView([entries[0].lat,entries[0].lng],15);
  resultName.textContent=`${name}駅`;
  resultLinesList.innerHTML=entries.map(e=>`
    <div class="result-line-tag">
      <div class="result-swatch" style="background:${e.color};"></div>
      <div class="result-badge" style="background:${e.color};">${LINE_ICONS[e.lineId]||'?'}</div>
      ${e.lineName}
    </div>`).join('');
  searchResult.style.display='block';
  activeBbTab = entries[0].lineId;
  buildBottomBar();
  renderBbStations(activeBbTab, name);
}

/* マーカークリック → 検索実行 */
function triggerStationSearch(name){
  selectStation(name);
  doSearch(name);
}

input.addEventListener('input',()=>{ selectedStation=null; searchBtn.disabled=true; showAC(input.value); });
input.addEventListener('keydown',e=>{
  const items=acList.querySelectorAll('.ac-item');
  if(!items.length) return;
  if(e.key==='ArrowDown'){e.preventDefault();acIndex=Math.min(acIndex+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('selected',i===acIndex));input.value=items[acIndex].dataset.name;}
  else if(e.key==='ArrowUp'){e.preventDefault();acIndex=Math.max(acIndex-1,0);items.forEach((el,i)=>el.classList.toggle('selected',i===acIndex));input.value=items[acIndex].dataset.name;}
  else if(e.key==='Enter'){
    if(acIndex>=0&&items[acIndex]) selectStation(items[acIndex].dataset.name);
    else if(stationIndex[input.value.trim()]) selectStation(input.value.trim());
    doSearch(selectedStation||input.value.trim());
  }
  else if(e.key==='Escape') acList.style.display='none';
});
document.addEventListener('click',e=>{ if(!document.getElementById('search-wrap').contains(e.target)) acList.style.display='none'; });
searchBtn.addEventListener('click',()=>doSearch(selectedStation||input.value.trim()));

/* ── サイドバー開閉（左のみ） ── */
const sidebarState={left:true};

function updateBtnPositions(){
  const leftW = sidebarState.left ? 260 : 0;
  document.getElementById('toggle-left').style.left = leftW + 'px';
}

function toggleSidebar(side){
  const el=document.getElementById(`sidebar-${side}`);
  const btn=document.getElementById(`toggle-${side}`);
  sidebarState[side]=!sidebarState[side];
  el.classList.toggle('collapsed',!sidebarState[side]);
  if(side==='left'){
    btn.textContent=sidebarState[side]?'◀':'▶';
    btn.title=sidebarState[side]?'閉じる':'開く';
  }
  updateBtnPositions();
  setTimeout(()=>map.invalidateSize(),280);
}

/* 初期ボタン位置 */
updateBtnPositions();
</script>
